<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITL4R</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Inter:wght@800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Hind Siliguri',sans-serif;background:#f8fafc;color:#0f172a;padding:14px}.nav{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px 18px;display:flex;justify-content:space-between;font-family:'Inter';font-weight:800}.hero{max-width:1100px;margin:14px auto;background:#0f172a;color:#fff;border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:30px;line-height:1.1}.search{max-width:1100px;margin:0 auto;width:100%;display:block;padding:14px 16px;border-radius:12px;border:1px solid #e2e8f0;outline:none}.grid{max-width:1100px;margin:14px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}.badge{margin-left:auto;font-size:11px;background:#f1f5f9;padding:4px 10px;border-radius:20px}.foot{text-align:center;margin-top:30px;color:#94a3b8;font-size:12px}</style></head><body>
<div class="nav"><span>BITL4R</span><span style="font-size:12px;font-weight:500;color:#64748b">Dhamrai Govt College</span></div>
<div class="hero"><div><span style="font-size:10px;background:#ffffff22;padding:4px 8px;border-radius:20px">HSC 2026 • All Notes</span><h1 style="margin-top:8px">Dhamrai College<br>Notes Archive</h1><p style="opacity:.6;font-size:13px;margin-top:6px">সব সাবজেক্টের নোট এক জায়গায়।</p></div><div style="font-size:60px">🎓</div></div>
<input class="search" id="s" placeholder="🔍 খুঁজো... economics, ict, bangla..." oninput="filt()">
<div class="grid" id="grid"></div>
<div class="foot">Developed by <b>Saikat Islam</b> • Helped by Polash Islam & Tanjid Hasan<br>bitl4r-art.github.io/BITL4R</div>
<script>
const subs=[{id:'bangla1st',n:'বাংলা ১ম পত্র',e:'📖'},{id:'bangla2nd',n:'বাংলা ২য়',e:'📖'},{id:'english1st',n:'English 1st',e:'🇬🇧'},{id:'english2nd',n:'English 2nd',e:'🇬🇧'},{id:'ict',n:'ICT',e:'💻'},{id:'islamic1st',n:'ইসলামের ইতিহাস ১ম',e:'🕌',f:['islamic1st.pdf']},{id:'islamic2nd',n:'ইসলামের ইতিহাস ২য়',e:'🕌'},{id:'civics1st',n:'পৌরনীতি ১ম',e:'🏛️'},{id:'civics2nd',n:'পৌরনীতি ২য়',e:'🏛️'},{id:'economics1st',n:'অর্থনীতি ১ম',e:'📈'},{id:'economics2nd',n:'অর্থনীতি ২য়',e:'📈'},{id:'economics',n:'Economics All',e:'💰'},{id:'socialwork1st',n:'সমাজকর্ম ১ম',e:'🤝'},{id:'socialwork2nd',n:'সমাজকর্ম ২য়',e:'🤝'}];
function render(list){document.getElementById('grid').innerHTML=list.map(s=>{let cnt=s.f?s.f.length:0;return `<a href="${cnt?`https://bitl4r-art.github.io/BITL4R/${s.f[0]}`:'#'}" target="_blank" style="text-decoration:none;color:inherit"><div class="card"><div style="width:44px;height:44px;background:#f1f5f9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px">${s.e}</div><div><b>${s.n}</b><div style="font-size:11px;color:#64748b">${s.id}.pdf</div></div><div class="badge">${cnt?cnt+' টি ফাইল':'ফাইল নেই'}</div></div></a>`}).join('')}
render(subs);
function filt(){let q=document.getElementById('s').value.toLowerCase();render(subs.filter(x=>x.n.toLowerCase().includes(q)||x.id.includes(q)))}
</script></body></html>
