<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITL4R - Dhamrai Notes</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0b;color:#fff;font-family:'Hind Siliguri',sans-serif}nav{padding:16px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #1f1f23;font-family:'Plus Jakarta Sans'} .hero{padding:32px 5% 24px;background:#0a0a0b}.hero h1{font-family:'Plus Jakarta Sans';font-size:44px;line-height:.95;letter-spacing:-1px}.hero h1 span{color:#facc15}.sub{color:#a1a1aa;margin-top:10px;font-size:14px}input{width:100%;margin-top:18px;background:#18181b;border:1px solid #27272a;padding:14px 18px;border-radius:100px;color:#fff;outline:none}.grid{padding:18px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:#121214;border:1px solid #1f1f23;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-decoration:none;color:#fff}.badge{margin-left:auto;background:#facc15;color:#000;font-size:10px;font-weight:800;padding:4px 10px;border-radius:100px}.foot{margin-top:20px;border-top:1px solid #1f1f23;padding:24px 5%;text-align:center}.foot h3{font-family:'Plus Jakarta Sans';font-size:15px;margin-bottom:6px}.foot p{color:#71717b;font-size:13px}</style></head><body>
<nav><b>BITL4R</b><span style="color:#71717a;font-size:12px">Dhamrai Govt College • HSC 2026</span></nav>
<div class="hero"><h1>All Notes.<br>One Place.<br><span>All Free.</span></h1><p class="sub">Dhamrai Govt College এর সব নোট এক জায়গায়। সার্চ করে বের করো।</p><input id="s" placeholder="Search... economics, ict, bangla..." oninput="filt()"></div>
<div class="grid" id="grid"></div>
<div class="foot">
<h3>Developed by <span style="color:#facc15">Saikat Islam</span></h3>
<p>Helped by <b style="color:#fff">Polash Islam</b> & <b style="color:#fff">Tanjid Hasan</b></p>
<p style="margin-top:10px;font-size:11px;color:#52525b">bitl4r-art.github.io/BITL4R • Dhamrai College, Savar Dhaka</p>
</div>
<script>
const subs=[
{id:'bangla1st',n:'বাংলা ১ম পত্র',e:'📖'},{id:'bangla2nd',n:'বাংলা ২য় পত্র',e:'📖'},
{id:'english1st',n:'English 1st Paper',e:'🇬🇧'},{id:'english2nd',n:'English 2nd Paper',e:'🇬🇧'},
{id:'ict',n:'ICT',e:'💻'},{id:'islamic1st',n:'ইসলামের ইতিহাস ১ম পত্র',e:'🕌',f:['islamic1st.pdf']},{id:'islamic2nd',n:'ইসলামের ইতিহাস ২য় পত্র',e:'🕌'},
{id:'civics1st',n:'পৌরনীতি ১ম পত্র',e:'🏛️'},{id:'civics2nd',n:'পৌরনীতি ২য় পত্র',e:'🏛️'},
{id:'economics1st',n:'অর্থনীতি ১ম পত্র',e:'📈'},{id:'economics2nd',n:'অর্থনীতি ২য় পত্র',e:'📈'},
{id:'socialwork1st',n:'সমাজকর্ম ১ম পত্র',e:'🤝'},{id:'socialwork2nd',n:'সমাজকর্ম ২য় পত্র',e:'🤝'},
];
function render(list){document.getElementById('grid').innerHTML=list.map(s=>{let c=s.f?1:0;let link=c?`https://bitl4r-art.github.io/BITL4R/${s.f[0]}`:'#';return `<a class="card" href="${link}" target="_blank"><div style="width:44px;height:44px;background:#18181b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px">${s.e}</div><div><b style="font-size:14px">${s.n}</b><div style="font-size:11px;color:#71717a">${s.id}.pdf</div></div><div class="badge">${c?'1 FILE':'EMPTY'}</div></a>`}).join('')}
render(subs);
function filt(){let q=document.getElementById('s').value.toLowerCase();render(subs.filter(s=>s.n.toLowerCase().includes(q)||s.id.includes(q)))}
</script></body></html>
