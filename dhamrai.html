<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BITL4R - Dhamrai College</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;background:#f8fafc;color:#0f172a}
.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #e2e8f0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Inter';font-weight:800;font-size:22px;letter-spacing:-.5px}
.hero{max-width:1100px;margin:20px auto;padding:30px 20px;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:24px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:34px;line-height:1.1;margin:8px 0}
.hero p{opacity:.7}
.container{max-width:1100px;margin:0 auto;padding:16px}
.search{width:100%;padding:16px 18px;border:1px solid #e2e8f0;border-radius:14px;font-size:16px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.07);border-color:#0f172a}
.icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.badge{font-size:11px;background:#f1f5f9;padding:3px 8px;border-radius:20px;color:#475569}
.footer{text-align:center;padding:30px;color:#94a3b8;font-size:13px;margin-top:20px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:99;padding:14px}
.box{background:#fff;max-width:650px;margin:30px auto;border-radius:20px;padding:22px;max-height:85vh;overflow:auto}
.file{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #f1f5f9;border-radius:12px;margin:8px 0}
.file a{background:#0f172a;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="nav"><div class="logo">BITL4R</div><div style="font-size:13px;color:#64748b">Dhamrai Govt College</div></div>
<div class="container">
<div class="hero"><div><p style="background:#ffffff1a;display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px">📚 HSC 2026 • All Notes</p><h1>Dhamrai College<br>Notes Archive</h1><p>সব সাবজেক্টের নোট এক জায়গায়। সার্চ করে বের করো।</p></div><div style="font-size:80px;opacity:.2">🎓</div></div>
<input id="s" class="search" placeholder="🔍 খুঁজো... economics, ict, bangla..." oninput="filt()">
<div class="grid" id="grid"></div>
<div class="footer">Developed by <b>Saikat Islam</b> • Helped by Polash Islam & Tanjid Hasan<br>bitl4r-art.github.io/BITL4R</div>
</div>
<div id="modal" class="modal" onclick="if(event.target==this)closeM()"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="mt"></h2><span onclick="closeM()" style="font-size:28px;cursor:pointer">×</span></div><div id="ml" style="margin-top:14px"></div></div></div>
