<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BITL4R - Dhamrai Govt College</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px}
.header{border:1px solid #222;padding:15px;border-radius:10px;margin-bottom:20px}
.highlight{color:#facc15}
.card{border:1px solid #222;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-decoration:none;color:#fff}
.icon{font-size:24px}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body>

<div class="header">
<div><b>BITL4R Project</b> · Dhamrai Govt College Notes Archive</div>
<div style="font-size:13px;opacity:.6">Developed by <span class="highlight">Saikat Islam</span> · HSC 2026</div>
<div style="font-size:11px;opacity:.4">bitl4r-art.github.io/BITL4R/</div>
</div>

<div id="list"></div>

<script>
const subjects = [
{id:'bangla1st',n:'বাংলা ১ম পত্র',e:'📖'},
{id:'bangla2nd',n:'বাংলা ২য় পত্র',e:'📖'},
{id:'english1st',n:'English 1st Paper',e:'🇬🇧'},
{id:'english2nd',n:'English 2nd Paper',e:'🇬🇧'},
{id:'ict',n:'তথ্য ও যোগাযোগ প্রযুক্তি',e:'💻'},
{id:'islamic1st',n:'ইসলামের ইতিহাস ১ম পত্র',e:'🕌',f:['islamic1st.pdf']},
{id:'islamic2nd',n:'ইসলামের ইতিহাস ২য় পত্র',e:'🕌'},
{id:'civics1st',n:'পৌরনীতি ১ম পত্র',e:'🏛️',f:['civics1st.pdf']},
{id:'civics2nd',n:'পৌরনীতি ২য় পত্র',e:'🏛️',f:['civics2nd.pdf']},
{id:'economics1st',n:'অর্থনীতি ১ম পত্র',e:'📈'},
{id:'economics2nd',n:'অর্থনীতি ২য় পত্র',e:'📈'},
{id:'socialwork1st',n:'সমাজকর্ম ১ম পত্র',e:'🤝'},
{id:'socialwork2nd',n:'সমাজকর্ম ২য় পত্র',e:'🤝'},
];

const list = document.getElementById('list');
list.innerHTML = subjects.map(s=>{
  const hasFile = s.f && s.f.length > 0;
  const link = hasFile ? `https://bitl4r-art.github.io/BITL4R/${s.f[0]}` : '#';
  const badge = hasFile 
    ? `<span style="background:#facc15;color:#000;padding:3px 10px;border-radius:20px;font-size:12px">1 FILE</span>`
    : `<span style="background:#222;color:#666;padding:3px 10px;border-radius:20px;font-size:12px">EMPTY</span>`;
  return `<a class="card" href="${link}" target="_blank"><div style="display:flex;gap:10px;align-items:center"><div class="icon">${s.e}</div><div>${s.n}</div></div>${badge}</a>`;
}).join('');
</script>

</body>
</html>
