<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITL4R - Notes</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Hind+Siliguri:wght@500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0b;color:#fff;font-family:'Plus Jakarta Sans',sans-serif}nav{padding:18px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #1f1f23}nav b{font-size:22px;letter-spacing:3px}.hero{padding:60px 5%;background:radial-gradient(600px at 20% 10%,#1e293b,transparent),#0a0a0b}.hero h1{font-size:56px;line-height:.9;letter-spacing:-2px}.hero h1 i{color:#facc15;font-style:normal}.sub{color:#71717a;margin-top:12px;max-width:400px}input{width:100%;margin-top:24px;background:#18181b;border:1px solid #27272a;padding:16px 20px;border-radius:100px;color:#fff;font-size:16px;outline:none}input:focus{border-color:#facc15}.grid{padding:30px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:#121214;border:1px solid #1f1f23;border-radius:20px;padding:20px;display:flex;gap:16px;align-items:center;cursor:pointer;transition:.2s}.card:hover{border-color:#facc15;transform:translateY(-3px)}.icon{width:56px;height:56px;background:#18181b;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px}.card h3{font-size:16px}.card p{color:#71717a;font-size:12px;margin-top:4px}.count{margin-left:auto;background:#facc15;color:#000;font-size:11px;font-weight:800;padding:4px 10px;border-radius:100px}.foot{text-align:center;padding:40px;color:#52525b;font-size:13px;border-top:1px solid #1f1f23;margin-top:20px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:20;padding:16px}.box{background:#121214;border:1px solid #27272a;max-width:600px;margin:40px auto;border-radius:24px;padding:24px}</style></head><body><nav><b>BITL4R</b><span style="color:#71717a;font-size:13px">Dhamrai College • HSC 2026</span></nav><div class="hero"><h1>All Notes.<br>One Place.<br><i>No Ads.</i></h1><p class="sub">Dhamrai Govt College এর সব নোট। Economics সহ সব সাবজেক্টে আনলিমিটেড PDF।</p><input id="search" placeholder="Search economics, ict, bangla..." oninput="filt()"></div><div class="grid" id="grid"></div><div class="foot">Developed by <b style="color:#fff">Saikat Islam</b> • Helped by Polash Islam & Tanjid Hasan</div><div id="modal" class="modal" onclick="if(event.target==this)closeM()"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="mt"></h2><span onclick="closeM()" style="cursor:pointer;font-size:24px">×</span></div><div id="ml" style="margin-top:18px"></div></div></div><script>const subs=[{id:'bangla1st',n:'বাংলা ১ম পত্র',e:'📖'},{id:'bangla2nd',n:'বাংলা ২য়',e:'📖'},{id:'english1st',n:'English 1st',e:'🇬🇧'},{id:'english2nd',n:'English 2nd',e:'🇬🇧'},{id:'ict',n:'ICT',e:'💻'},{id:'islamic1st',n:'ইসলাম ১ম',e:'🕌'},{id:'islamic2nd',n:'ইসলাম ২য়',e:'🕌'},{id:'civics1st',n:'পৌরনীতি ১ম',e:'🏛️'},{id:'civics2nd',n:'পৌরনীতি ২য়',e:'🏛️'},{id:'economics1st',n:'অর্থনীতি ১ম',e:'📈'},{id:'economics2nd',n:'অর্থনীতি ২য়',e:'📈'},{id:'economics',n:'Economics All',e:'💰'},{id:'socialwork1st',n:'সমাজকর্ম ১ম',e:'🤝'},{id:'socialwork2nd',n:'সমাজকর্ম ২য়',e:'🤝'}];let files=[];fetch('https://api.github.com/repos/bitl4r-art/BITL4R/contents/').then(r=>r.json()).then(d=>{files=d.filter(f=>/\.(pdf|jpg|jpeg|png)$/i.test(f.name)).map(f=>f.name);render(subs)});function render(list){let g=document.getElementById('grid');g.innerHTML='';list.forEach(s=>{let c=files.filter(f=>f.toLowerCase().startsWith(s.id.toLowerCase())).length;g.innerHTML+=`<div class="card" onclick="openS('${s.id}')"><div class="icon">${s.e}</div><div><h3>${s.n}</h3><p>${s.id}.pdf</p></div><div class="count">${c?c+' FILES':'EMPTY'}</div></div>`});}function filt(){let q=document.getElementById('search').value.toLowerCase();render(subs.filter(s=>s.n.toLowerCase().includes(q)||s.id.includes(q)))}function openS(id){let s=subs.find(x=>x.id==id);document.getElementById('modal').style.display='block';document.getElementById('mt').innerText=s.n;let m=files.filter(f=>f.toLowerCase().startsWith(id.toLowerCase()));document.getElementById('ml').innerHTML=m.length?m.map((f,i)=>{let u=`https://bitl4r-art.github.io/BITL4R/${encodeURIComponent(f)}`;return `<div style="display:flex;justify-content:space-between;padding:12px;border:1px solid #27272a;border-radius:12px;margin:8px 0"><span>${i+1}. ${f}</span><a href="${u}" target="_blank" style="background:#facc15;color:#000;padding:6px 14px;border-radius:100px;text-decoration:none;font-weight:700;font-size:12px">OPEN</a></div>`}).join(''):`<p style="color:#71717a">No file yet. Upload <b>${id}-ch1.pdf</b>, <b>${id}-ch2.pdf</b>...</p>`}function closeM(){document.getElementById('modal').style.display='none'}</script></body></html>}
